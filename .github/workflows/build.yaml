name: Continuous Integration

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Visual Studio 2026
          os: windows-2025-vs2026

#        - name: Linux GCC 12
#          os: ubuntu-26.04
#          deps_cmdline: sudo apt update && sudo apt install libxx-dev

    steps:
    - uses: actions/checkout@v4

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Install Emscripten
      uses: emscripten-core/setup-emsdk@v15
      with:
        version: 6.0.1

    - name: Install Dependencies
      shell: bash
      run: |
        if [[ -n "${{ matrix.config.deps_cmdline }}" ]]; then
          eval ${{ matrix.config.deps_cmdline }}
        fi
        mkdir build

    - name: Install CPPBuild
      shell: bash
      run: |
        git clone https://github.com/dpjudas/CPPBuild.git
        cd CPPBuild
        if [[ "${{ runner.os }}" == 'Windows' ]]; then
          msbuild.exe //t:Build "//p:Configuration=Release;Platform=x64" CPPBuild.sln
        elif [[ "${{ runner.os }}" == 'Linux' ]]; then
          make -j 4
          make install
        fi
        cd ..

    - name: Add cppbuild to PATH
      if: runner.os == 'Windows'
      run: |
        echo "Adding directory to search path: $($pwd.Path)\CPPBuild\Build\Release\x64\bin"
        echo "$($pwd.Path)\CPPBuild\Build\Release\x64\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

    - name: Configure
      shell: bash
      run: |
        cppbuild configure

    - name: Build
      shell: bash
      run: |
        if [[ "${{ runner.os }}" == 'Windows' ]]; then
          msbuild.exe //t:Build "//p:Configuration=Debug;Platform=x64" WebCPP.sln
          msbuild.exe //t:Build "//p:Configuration=Release;Platform=x64" WebCPP.sln
        elif [[ "${{ runner.os }}" == 'Linux' ]]; then
          make
        fi

    - name: Create Package
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cppbuild create-package

    - name: Upload WebCPP Package
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        path: Build/Packages/WebCPP.zip
        name: WebCPP-emscripten-6.0.1

#    - name: List Build Directory
#      if: always()
#      shell: bash
#      run: |
#        git status
#        ls -lR Build

  deploy:
    name: Update Latest successful build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
    - name: Download Emscripten artifact
      uses: actions/download-artifact@v8
      with:
        name: WebCPP-emscripten-6.0.1
        path: build/WebCPP-emscripten-6.0.1.zip

    - name: Update nightly release
      uses: pyTooling/Actions/releaser@r0
      with:
        tag: nightly
        rm: true
        token: ${{ secrets.GITHUB_TOKEN }}
        files: build/WebCPP-emscripten-6.0.1.zip
